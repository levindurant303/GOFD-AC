# GOFDAC 反作弊系统配置
# 配置文件版本 - 请勿修改
config-version: 2.0

# 通用设置
general:
  # 是否启用反作弊系统
  enabled: true
  # 警报阈值 - 违规值达到此数值时发送警报
  alert-threshold: 10
  # 语言设置
  language: "zh_CN"
  # 自动保存间隔（分钟）
  auto-save-interval: 5
  # 是否记录检测日志
  log-detections: true
  # 日志级别: DEBUG, INFO, WARN, ERROR
  log-level: "INFO"

# 移动检测设置
movement:
  # 是否启用移动检测
  enabled: true
  # 最大行走速度
  max-walk-speed: 0.65
  # 最大飞行速度
  max-fly-speed: 1.5
  # 最大垂直速度
  max-vertical-speed: 0.6
  # 最大跳跃高度
  max-jump-height: 1.5
  # 是否启用飞行检测
  flight-check: true
  # 是否启用速度检测
  speed-check: true
  # 是否启用地面加速检测
  ground-acceleration-check: true
  # 是否启用液体移动检测
  liquid-movement-check: true
  # 是否启用不规则移动检测
  irregular-movement-check: true
  # 是否启用不可能移动检测
  impossible-movement-check: true
  # 是否启用船飞检测
  boat-fly-check: true
  # 是否启用滑翔机异常检测
  elytra-check: true
  # 移动检测灵敏度 (1-10)
  sensitivity: 5

# 战斗检测设置
combat:
  # 是否启用战斗检测
  enabled: true
  # 最大CPS（每秒点击次数）
  max-cps: 15
  # 最大攻击距离
  max-reach: 4.5
  # 最大角度变化
  max-angle-change: 90.0
  # 是否启用暴击检测
  critical-hit-check: true
  # 是否启用穿墙攻击检测
  wall-hit-check: true
  # 是否启用连击检测
  combo-pattern-check: true
  # 是否启用自瞄检测
  aimbot-check: true
  # 是否启用KillAura检测
  killaura-check: true
  # 是否启用自动格挡检测
  auto-block-check: true
  # 战斗检测灵敏度 (1-10)
  sensitivity: 6

# 物品检测设置
items:
  # 是否启用物品检测
  enabled: true
  # 是否检测可疑附魔
  suspicious-enchantments: true
  # 是否检测非法堆叠
  illegal-stacks: true
  # 是否检测自定义药水
  custom-potions: true
  # 是否检测消耗速度
  consumption-speed: true
  # 是否检测可疑食物
  suspicious-food: true
  # 最大物品使用间隔（毫秒）
  max-use-interval: 500

# 交互检测设置
interaction:
  # 是否启用交互检测
  enabled: true
  # 最大方块交互距离
  max-block-interact-distance: 6.0
  # 最大方块破坏速度（毫秒）
  max-block-break-speed: 100
  # 是否启用破坏速度检测
  break-speed-check: true
  # 是否启用Nuker检测
  nuker-check: true
  # 是否启用X-Ray检测
  xray-detection: true
  # 是否启用放置速度检测
  place-speed-check: true
  # 是否启用Scaffold检测
  scaffold-detection: true
  # 交互检测灵敏度 (1-10)
  sensitivity: 4

# 背包检测设置
inventory:
  # 是否启用背包检测
  enabled: true
  # 最大点击速度（毫秒）
  max-click-speed: 50
  # 是否检测快速移动
  fast-move-check: true
  # 是否检测非法转移
  illegal-transfer-check: true
  # 是否检测自动整理
  auto-sort-check: true
  # 是否检测可疑背包
  suspicious-inventory-check: true

# 网络检测设置
packet:
  # 是否启用网络检测
  enabled: true
  # 最大数据包速率（包/秒）
  max-packet-rate: 1000
  # 是否检测数据包洪水
  packet-flood-check: true
  # 是否检测可疑数据包
  suspicious-packet-check: true
  # 是否检测延迟异常
  latency-anomaly-check: true

# 聊天检测设置
chat:
  # 是否启用聊天检测
  enabled: true
  # 最大消息频率（消息/秒）
  max-message-frequency: 5
  # 是否检测广告
  advertisement-check: true
  # 是否检测刷屏
  spam-check: true
  # 是否检测重复消息
  repeat-message-check: true
  # 敏感词过滤列表
  blocked-words:
    - "www."
    - ".com"
    - ".net"
    - ".org"
    - "discord.gg"
    - "作弊"
    - "hack"
    - "cheat"
    - "crack"

# 环境检测设置
environment:
  # 是否启用环境检测
  enabled: true
  # 是否启用X-Ray检测
  xray-detection: true
  # 是否启用Scaffold检测
  scaffold-detection: true
  # 是否启用自动工具检测
  auto-tool-check: true
  # 珍贵矿石列表
  valuable-ores:
    - "DIAMOND_ORE"
    - "DEEPSLATE_DIAMOND_ORE"
    - "EMERALD_ORE"
    - "DEEPSLATE_EMERALD_ORE"
    - "ANCIENT_DEBRIS"
    - "NETHERITE_SCRAP"

# 随机检查系统
random-checks:
  # 是否启用随机检查
  enabled: true
  # 随机检查间隔（秒）
  interval: 30
  # 深度检查间隔（分钟）
  deep-check-interval: 5
  # 随机检查几率（百分比）
  check-chance: 15
  # 深度检查几率（百分比）
  deep-check-chance: 5

# 惩罚系统设置
punishment:
  # 是否启用惩罚系统
  enabled: true
  # 是否自动踢出
  auto-kick: true
  # 踢出阈值
  kick-threshold: 25
  # 是否记录惩罚日志
  log-punishments: true
  # 惩罚动作
  actions:
    - "警告"
    - "踢出"
    - "临时封禁"
    - "永久封禁"
  # 自动封禁设置
  auto-ban:
    enabled: false
    ban-threshold: 100
    duration: "7d"

# 警报系统设置
alerts:
  # 是否启用警报系统
  enabled: true
  # 警报前缀
  prefix: "&8[&cGOFDAC&8]"
  # 警报冷却时间（毫秒）
  cooldown: 5000
  # 是否在控制台显示警报
  console-alerts: true
  # 是否记录警报到文件
  log-to-file: true
  # 警报广播范围
  broadcast-range: 50

# 调试设置
debug:
  # 是否启用调试模式
  enabled: false
  # 是否记录调试日志
  log-debug: false
  # 调试日志最大条目
  max-log-entries: 10000
  # 调试玩家列表
  debug-players: []
  # 性能监控
  performance-monitoring: true

# 性能设置
performance:
  # 是否启用性能监控
  monitoring: true
  # 最大样本数量
  max-samples: 1000
  # 采样间隔（秒）
  sample-interval: 1
  # 性能警告阈值
  warning-thresholds:
    max-detection-time: 10
    max-events-per-second: 1000
    max-cpu-usage: 80

# 数据库设置（未来功能）
database:
  enabled: false
  type: "sqlite"
  host: "localhost"
  port: 3306
  name: "gofdac"
  username: ""
  password: ""
  table-prefix: "gofdac_"

# 集成设置
integrations:
  # WorldGuard 集成
  worldguard:
    enabled: false
    # 在保护区域是否启用检测
    check-in-regions: true
  # Vault 集成
  vault:
    enabled: false
  # ProtocolLib 集成
  protocollib:
    enabled: false

# 白名单设置
whitelist:
  # 玩家白名单
  players: []
  # 世界白名单
  worlds: []
  # 权限白名单
  permissions:
    - "gofdac.bypass"
  # IP白名单
  ips: []

# 自定义检测规则
custom-rules:
  # 规则示例
  example-rule:
    enabled: false
    condition: "player.hasPermission('vip')"
    action: "bypass"
    message: "VIP玩家绕过检测"

# 更新检查
update-check:
  enabled: true
  notify-on-join: true
  check-interval: 1440

# 统计设置
statistics:
  # 是否启用统计
  enabled: true
  # 统计保存间隔（分钟）
  save-interval: 10
  # 是否匿名统计
  anonymous: true
  # 统计项目
  track:
    - "detections"
    - "false_positives"
    - "performance"
    - "punishments"

# 消息配置
messages:
  prefix: "&8[&cGOFDAC&8]&7"
  # 警报消息
  alerts:
    flight: "&c飞行作弊嫌疑"
    speed: "&c速度作弊嫌疑"
    cps: "&c高频攻击嫌疑"
    reach: "&c长臂攻击嫌疑"
    killaura: "&cKillAura嫌疑"
    aimbot: "&c自瞄嫌疑"
  # 惩罚消息
  punishments:
    kick: "&c你因作弊行为被踢出服务器"
    warn: "&c警告：检测到可疑行为，请停止作弊"
    ban: "&c你因作弊被永久封禁"
  # 命令消息
  commands:
    no-permission: "&c你没有权限使用此命令"
    player-offline: "&c玩家不在线"
    config-reloaded: "&a配置已重载"
    alerts-toggled: "&a警报显示已{status}"
  # 调试消息
  debug:
    enabled: "&a调试模式已启用"
    disabled: "&c调试模式已禁用"

# 高级设置（谨慎修改）
advanced:
  # 检测容差系数
  tolerance-factor: 1.3
  # 违规值衰减速率（点/秒）
  violation-decay-rate: 1
  # 最大历史记录长度
  max-history-length: 50
  # 异步检测
  async-detection: true
  # 线程池大小
  thread-pool-size: 4
  # 缓存设置
  cache:
    enabled: true
    size: 1000
    expire-time: 300

# 极严格模式
ultra-strict-mode:
  enabled: true
  # 移动检测
  movement:
    max-walk-speed: 0.5
    max-fly-speed: 1.0
    max-vertical-speed: 0.3
    tolerance: 1.05  # 5% 容差

  # 战斗检测
  combat:
    max-cps: 10
    max-reach: 3.5
    max-angle-change: 30.0

  # 环境检测
  environment:
    max-break-interval: 200
    max-blocks-per-second: 3

  # 自动惩罚
  auto-punish: true
  punishment-levels:
    kick: 15
    temp-ban: 25
    permaban: 50

  # 零容忍违规（直接封禁）
  zero-tolerance:
    - "wurst_flight_strict"
    - "killaura_strict"
    - "wall_hit_strict"
    - "phasing"

  # 严格记录
  logging:
    detailed-logs: true
    log-all-violations: true
    save-evidence: true